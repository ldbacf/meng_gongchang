# Prometheus 抓取配置（阶段 5 观测三件套的「采集」侧）。
#
# 后端只负责暴露 /metrics（app/interface/routers/metrics.py → MetricsRegistry），
# 采集与告警在 Prometheus 侧，避免把监控策略塞进业务进程。
#
# 启动：docker compose --profile monitoring up -d prometheus grafana
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: medrag-backend
    metrics_path: /metrics
    static_configs:
      # 容器内走服务名；本地直跑后端时改为 127.0.0.1:8000
      - targets: ["backend:8000"]
        labels:
          service: medrag
          component: api
