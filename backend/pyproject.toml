[project]
name = "mineru-pipeline"
version = "0.1.0"
description = "MinerU Pipeline Phase 1 - Document ingestion and parsing engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "minio>=7.2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "PyMuPDF>=1.24.0",
    "tqdm>=4.66.0",
    "elasticsearch>=8.19.0,<9",
    "pymilvus>=2.4.15",
    "sentence-transformers>=3.0.0",
    "modelscope>=1.37.0",
    "torch>=2.6.0",
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-huggingface>=0.1.0",
    # LangGraph 重构（显式声明，避免仅经 langchain 传递）
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "app", "cli"]

[project.scripts]
# API 启动入口（含 Windows SelectorEventLoop 修正，见 src/run_api.py）
medrag-api = "src.run_api:main"
pipeline-api = "src.main:app"
# 阶段 3：独立 worker 进程（驱动 IngestionGraph）
pipeline-worker = "app.application.worker:main"
# 阶段 4 前置：bge-m3 独立常驻服务（模型只加载一次）
embedding-server = "app.application.embedding_server:run"
# 阶段 5：运维 CLI（复用 application service/图，替代 scripts/）
medrag-init-es = "cli.init_es:main"
medrag-init-milvus = "cli.init_milvus:main"
medrag-import-es = "cli.import_es:main"
medrag-import-milvus = "cli.import_milvus:main"
medrag-chunk = "cli.run_chunker:main"
medrag-scan-submit = "cli.scan_submit:main"
medrag-check-status = "cli.check_status:main"
medrag-list-bucket = "cli.list_bucket:main"
medrag-backfill-doc-tasks = "cli.backfill_document_tasks:main"
medrag-migrate-doc-id = "cli.migrate_doc_id:main"
medrag-download-model = "cli.download_model:main"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
