# 应用服务共享环境（阶段 5：env/secrets 收敛到 Compose，不落 .env 明文）。
# 生产用 `docker compose --env-file prod.env` 覆盖弱口令（POSTGRES_PASSWORD 等）。
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-mineru}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineru123}
  POSTGRES_DB: ${POSTGRES_DB:-mineru_pipeline}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
  ES_HOST: elasticsearch
  ES_PORT: "9200"
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 必须显式设置}
  MINERU_TOKENS: ${MINERU_TOKENS:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
  # bge-m3 经独立常驻服务（阶段 4 前置）；容器内走服务名
  EMBEDDING_MODE: remote
  EMBEDDING_SERVICE_URL: http://embedding-service:8084

services:
  postgres:
    image: postgres:16-alpine
    container_name: mineru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mineru
      POSTGRES_PASSWORD: mineru123
      POSTGRES_DB: mineru_pipeline
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineru -d mineru_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4.8
    container_name: mineru-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mineru-minio
    restart: unless-stopped
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  elasticsearch:
    image: elasticsearch:8.19.15
    container_name: mineru-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
      - ./data/plugins/elasticsearch-analysis-ik-8.19.15.zip:/ik.zip:ro
    command: >
      bash -c "
        elasticsearch-plugin list | grep -q analysis-ik ||
          elasticsearch-plugin install --batch file:///ik.zip;
        /usr/local/bin/docker-entrypoint.sh elasticsearch
      "
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health?local=true"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  kibana:
    image: kibana:8.19.15
    container_name: mineru-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: mineru-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: ["etcd", "-advertise-client-urls=http://127.0.0.1:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    volumes:
      - ./data/etcd:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: mineru-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./data/milvus:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=minioadmin
      - MINIO_SECRET_ACCESS_KEY=minioadmin123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      - etcd
      - minio

  attu:
    image: zilliz/attu:v2.4.12
    container_name: mineru-attu
    restart: unless-stopped
    ports:
      - "8002:3000"
    environment:
      - MILVUS_URL=milvus:19530
    depends_on:
      - milvus

  # 阶段 5：backend API（uvicorn，2 worker 进程）；
  # bge-m3 走独立 embedding-service（EMBEDDING_MODE=remote），故本进程不加载模型。
  backend:
    profiles: ["app"]
    build:
      context: .
    container_name: mineru-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    restart: unless-stopped
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # 阶段 3/5：入库 worker（独立进程驱动 IngestionGraph；O-3.2）。
  # 横向扩展 = 同一服务 `--scale ingestion-worker=2`，凭队列认领锁保证单消费者。
  # 本地开发用 `uv run pipeline-worker` 独立终端运行。
  ingestion-worker:
    profiles: ["app"]
    build:
      context: .
    container_name: mineru-ingestion-worker
    command: ["uv", "run", "pipeline-worker"]
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./models:/app/models
    # 队列消费活性探针：worker 无 HTTP 端口，以「主进程存活 + 能连上 Redis」近似
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os,sys; sys.exit(0 if redis.Redis(host=os.environ.get('REDIS_HOST','redis'),port=6379,socket_connect_timeout=3).ping() else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # 阶段 4 前置：bge-m3 独立常驻服务（模型只加载一次，供 API/worker 经 HTTP 调用）。
  # 宿主已挂载 4.3G 模型，不需在镜像内复制。本地开发用 `uv run embedding-server`。
  embedding-service:
    profiles: ["app"]
    build:
      context: .
    container_name: mineru-embedding-service
    command: ["uvicorn", "app.application.embedding_server:app", "--host", "0.0.0.0", "--port", "8084"]
    restart: unless-stopped
    volumes:
      - ./models:/app/models
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8084/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
