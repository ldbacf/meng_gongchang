name: CI

on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend unit tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run pytest
        env:
          # 单测构造 Settings 时使用（.env 不存在于 CI）
          JWT_SECRET_KEY: ci-secret
        run: uv run pytest

      - name: Verify Alembic migrations (offline SQL)
        env:
          JWT_SECRET_KEY: ci-secret
        run: uv run alembic upgrade head --sql > /dev/null
